    //OPTIMIZE WAY
    function groupBirthdays(users, groupBy) {
      const result = new Map();

      for (const { birthday, ...user } of users) {
        const key = getKey(groupBy, birthday);

        if (!result.has(key)) {
          result.set(key, []);
        }

        result.get(key).push({ ...user, birthday });
      }

      return result;
    }

    function getKey(groupBy, date) {
      switch (groupBy) {
        case "day":
          return date.getDate();
        case "year":
          return date.getFullYear();
        default:
          return date.getMonth() + 1; // month
      }
    }

    const users = [
      { name: "Akash", birthday: new Date("2000-05-10") },
      { name: "Ravi", birthday: new Date("1999-05-25") },
      { name: "Neha", birthday: new Date("2001-08-10") },
      { name: "Aman", birthday: new Date("2000-08-18") }
    ];

    ["month", "day", "year"].forEach(type => {
      console.log(
        `Grouped by ${type}:`,
        groupBirthdays(users, type)
      );
    });
