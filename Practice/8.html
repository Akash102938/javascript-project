<body style="background-color: #121212; color: wheat;">
    <h1>Promise Topic</h1>

<script>
    const value = 5.9;
    const promise = new Promise((resolve,reject)=>{
       if(Number.isInteger(value)){
        resolve(value);
       }
       else{
        reject('its not an integer number')
       }
    })
    .then(value =>{
        return value*2;
    })
    .then(addTen =>{
        return addTen+10;
    })
    .then(multiplyByThree =>{
        return multiplyByThree*3;
    })
    .then((finalOutPut)=>{
        console.log(finalOutPut);
    })
    .catch((error)=>{
        console.log(error);
        
    })
</script>
